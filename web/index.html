<!doctype html>
<meta charset="utf-8">
<title>文明 6 区域规划 · 局面求值器</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#12161b; --panel:#1a2027; --panel2:#212a33; --line:#2c3742;
  --fg:#dfe6ee; --dim:#8b98a6; --accent:#5bb8e8; --ok:#7ad07a; --bad:#e2685f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif}
h1{font-size:16px;margin:0;font-weight:600}
h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:4px 6px;font:inherit}
.muted,.hint{color:var(--dim);font-size:12px}
.warn{color:#e8c05a;background:#2a2314;border:1px solid #4a3d17;
  border-radius:6px;padding:8px 10px;margin:8px 0;font-size:12px}

header{display:flex;align-items:center;gap:14px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{padding:5px 14px}
.tab.on{background:var(--accent);color:#08131c;border-color:var(--accent);font-weight:600}
.sub{color:var(--dim);font-size:12px}

main{display:grid;grid-template-columns:230px 1fr 360px;gap:0;
  height:calc(100vh - 47px)}
@media (max-width:1100px){main{grid-template-columns:1fr;height:auto}}
aside,section{overflow:auto;padding:12px 14px}
aside{border-right:1px solid var(--line);background:var(--panel)}
#right{border-left:1px solid var(--line);background:var(--panel)}

.pgroup{margin-bottom:14px}
.prow{display:flex;flex-wrap:wrap;gap:5px}
.pb{display:flex;flex-direction:column;align-items:flex-start;line-height:1.3;
  padding:5px 8px;min-width:62px}
.pb i{font-style:normal;color:var(--dim);font-size:10px}
.pb.on{background:var(--accent);color:#08131c;border-color:var(--accent);font-weight:600}
.pb.on i{color:#0c2331}

#modebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:8px 10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;margin-bottom:10px}
.lvhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;
  padding:1px 9px;font-size:11px;color:var(--dim)}
.goal{display:flex;align-items:center;gap:8px;width:100%}
.gname{width:42px;font-size:12px;font-weight:600}
.gbar{flex:1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.gbar i{display:block;height:100%;transition:width .18s}
.gnum{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim)}
.gnum.ok{color:var(--ok);font-weight:600}
.lvfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;margin-top:4px}

svg{width:100%;height:auto;display:block}
g.hex polygon{stroke:#0d1115;stroke-width:1.5}
g.hex{cursor:pointer}
g.hex:hover polygon:first-child{stroke:var(--accent);stroke-width:2.5}
g.hex.sel polygon:first-child{stroke:#fff;stroke-width:2.5}
g.hex.blocked{cursor:not-allowed}
.veil{fill:rgba(10,14,18,.55);stroke:none;pointer-events:none}
.dist{fill:rgba(16,22,28,.82);stroke:#cfe3f2;stroke-width:1.4}
.dist.center{stroke:#e8c05a;stroke-width:2.2}
text{text-anchor:middle;pointer-events:none;font-family:inherit}
.dname{font-size:12px;font-weight:700;fill:#eaf3fb}
.dname2{font-size:9px;fill:#a9bccd}
.bcount{font-size:9px;fill:#e8c05a}
.feat{font-size:15px;fill:rgba(255,255,255,.72)}
.res{fill:#e8c05a;stroke:#3a2f10;stroke-width:1}
.river{fill:#6fc2f0;stroke:none}
.wonder{font-size:13px;fill:#e8c05a}
.pv{font-size:14px;font-weight:800;paint-order:stroke;stroke:#0d1115;stroke-width:3.5}

.tot{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;
  cursor:pointer;font-variant-numeric:tabular-nums}
.tot:hover{background:var(--panel2)}
.tot.hi{background:var(--panel2);outline:1px solid var(--line)}
.tot .yname{flex:1}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;flex:none}

.bd-yield{margin:10px 0 4px}
.bd-h{display:flex;align-items:center;gap:8px;font-weight:600;
  padding-bottom:4px;border-bottom:1px solid var(--line)}
.bd-h b{margin-left:auto;font-variant-numeric:tabular-nums}
.bd-src{margin:6px 0 6px 2px;padding-left:8px;border-left:2px solid var(--line)}
.bd-sh{display:flex;gap:8px;font-size:13px;color:#c3d2e0}
.bd-sh b{margin-left:auto;font-variant-numeric:tabular-nums}
.bd-leaf{display:grid;grid-template-columns:1fr auto;gap:2px 8px;
  font-size:12px;padding:2px 0}
.bd-leaf.dim{opacity:.42}
.bd-leaf .lv{font-variant-numeric:tabular-nums;color:var(--accent)}
.bd-leaf.dim .lv{color:var(--dim)}
.bd-leaf .lid{grid-column:1/-1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;color:#6f8090;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{background:#3a2c12;color:#e8c05a;border-radius:4px;padding:0 5px;
  margin-left:6px;font-size:10px}

.lvlist{width:100%;border-collapse:collapse;font-size:13px}
.lvlist th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;
  padding:6px 8px;border-bottom:1px solid var(--line)}
.lvlist td{padding:7px 8px;border-bottom:1px solid var(--line)}
.lvlist tbody tr{cursor:pointer}
.lvlist tbody tr:hover{background:var(--panel2)}

.settle{margin-top:10px;padding:12px;border-radius:8px;width:100%;
  background:var(--panel2);border:1px solid var(--line)}
.settle.win{border-color:#2f6b3a}
.settle.lose{border-color:#6b3430}
.stitle{font-weight:700;font-size:15px}
.stars{font-size:24px;color:#e8c05a;letter-spacing:3px;margin:2px 0 6px}
.sgrid{border-collapse:collapse;font-size:12px}
.sgrid td{padding:2px 10px 2px 0;vertical-align:top}
.sgrid td:first-child{color:var(--dim);white-space:nowrap}
#tileinfo{font-size:12px;color:var(--dim);margin-bottom:8px;min-height:20px}
</style>

<header>
  <h1>文明 6 区域规划</h1>
  <span class="sub">局面求值器 · 每一点产出都能追到具体的表行</span>
  <div class="tabs">
    <button class="tab" data-mode="自由">自由模式</button>
    <button class="tab" data-mode="挑战">挑战模式</button>
  </div>
</header>

<main>
  <aside id="palette"></aside>
  <section>
    <div id="modebar"></div>
    <div id="levellist" style="display:none"></div>
    <div id="play">
      <div id="tileinfo"></div>
      <div id="map"></div>
      <div id="diag"></div>
      <p class="hint">
        悬停不到的信息都在图上：数字是<b>把当前笔刷放到那一格</b>会让高亮产出增加多少
        （两次求值之差）。灰掉的格子不可放置，鼠标停上去有原因。
      </p>
    </div>
  </section>
  <section id="right">
    <h4>产出汇总（点一项切换拆解）</h4>
    <div id="totals"></div>
    <h4 style="margin-top:14px">产出拆解</h4>
    <div id="breakdown"></div>
    <p class="hint" style="margin-top:12px">
      每条叶子后面的 id 是 <code>adjacency_rules.规则id</code>。
      增量为 0 的规则<b>灰显但保留</b>——「为什么没有加成」与「有多少加成」
      是同等重要的信息。
    </p>
  </section>
</main>

<script type="module" src="dist/web/app.js"></script>
