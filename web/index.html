<!doctype html>
<meta charset="utf-8">
<title>区域规划 · 文明 VI 规则镜像</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ink:#e9edf0; --muted:#8f9da7; --faint:#5d6b74;
  --navy:#0b1117; --navy-2:#101a22; --navy-3:#162630;
  --line:rgba(167,190,195,.20); --line-strong:rgba(200,177,113,.52);
  --gold:#d1b26a; --gold-hot:#f2d48a; --teal:#66c7c4;
  --red:#d87868; --green:#8ac99a;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  --display:Georgia,"Songti SC","STSong",serif;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  color:var(--ink); background:
    radial-gradient(circle at 74% 18%,rgba(53,119,121,.16),transparent 27rem),
    radial-gradient(circle at 18% 100%,rgba(143,102,49,.11),transparent 30rem),
    var(--navy);
  font:13px/1.45 var(--sans); letter-spacing:.01em;
}
body:before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.22;
  background-image:linear-gradient(30deg,rgba(255,255,255,.025) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.025) 87.5%,rgba(255,255,255,.025)),
    linear-gradient(150deg,rgba(255,255,255,.025) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.025) 87.5%,rgba(255,255,255,.025));
  background-size:52px 90px; background-position:0 0,26px 45px;
}
body:after{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.09;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.15) 4px);
  mix-blend-mode:screen;
}
button,select,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{
  color:var(--ink); background:rgba(21,38,48,.88); border:1px solid var(--line);
  border-radius:3px; padding:7px 11px; cursor:pointer; transition:.18s ease;
}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold-hot);transform:translateY(-1px)}
button:disabled{opacity:.38;cursor:default}
a{color:var(--gold-hot);text-decoration:none}
a:hover{text-decoration:underline}
select{
  color:var(--ink);background:#13242d;border:1px solid var(--line);
  border-radius:3px;padding:6px 8px;outline:none;
}
select:focus,button:focus-visible,a:focus-visible{outline:1px solid var(--teal);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.04em}
h4{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.muted,.hint{color:var(--muted);font-size:11px}
.warn{color:#f1d27d;background:rgba(106,75,25,.22);border:1px solid rgba(218,168,62,.36);
  border-radius:3px;padding:8px 10px;margin:8px 0;font-size:11px}

/* 入口页：简洁的文明地图风格，而不是普通表单首页 */
#home-screen{
  min-height:100vh;display:grid;place-items:center;padding:34px 24px;
  position:relative;overflow:hidden;
}
.home-shell{width:min(1080px,100%);position:relative}
.home-topline{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:10px;letter-spacing:.17em;text-transform:uppercase}
.home-mark{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--gold);
  color:var(--gold);font-size:12px;transform:rotate(30deg)}
.home-mark span{transform:rotate(-30deg)}
.home-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(310px,.95fr);gap:64px;align-items:end;
  padding:78px 0 52px;border-bottom:1px solid var(--line-strong)}
.home-kicker{color:var(--teal);font-size:12px;letter-spacing:.2em;margin-bottom:15px}
.home-title{font-size:clamp(42px,7vw,78px);line-height:1.04;color:#f2f1e8}
.home-title em{display:block;color:var(--gold);font-style:normal}
.home-copy{max-width:470px;color:var(--muted);margin-top:24px;font-size:13px}
.home-copy b{color:var(--ink);font-weight:500}
.home-constellation{height:230px;position:relative;display:grid;place-items:center}
.home-constellation:before{content:"";position:absolute;inset:15px 28px;background:
  linear-gradient(30deg,transparent 48%,rgba(209,178,106,.26) 49%,transparent 50%),
  linear-gradient(150deg,transparent 48%,rgba(102,199,196,.20) 49%,transparent 50%);
  background-size:72px 124px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);opacity:.7}
.home-tile{position:absolute;width:74px;height:86px;display:grid;place-items:center;
  background:rgba(17,35,43,.90);border:1px solid var(--line-strong);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  box-shadow:0 0 32px rgba(102,199,196,.12)}
.home-tile img{width:45px;height:45px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.home-tile:nth-child(1){top:5px;left:42%}.home-tile:nth-child(2){top:70px;left:13%}
.home-tile:nth-child(3){top:70px;right:14%}.home-tile:nth-child(4){bottom:4px;left:42%}
.home-tile:nth-child(5){top:92px;left:42%;opacity:.8;border-color:var(--teal)}
.home-tile:nth-child(5) img{width:30px;height:30px}
.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}
.mode-card{min-height:118px;padding:18px 20px;text-align:left;position:relative;overflow:hidden;
  border-color:rgba(209,178,106,.36);background:linear-gradient(135deg,rgba(27,49,57,.95),rgba(15,27,34,.94))}
.mode-card:after{content:"";position:absolute;right:-26px;bottom:-38px;width:120px;height:120px;border:1px solid rgba(209,178,106,.25);
  transform:rotate(30deg);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.mode-card:hover{border-color:var(--gold-hot);box-shadow:0 12px 35px rgba(0,0,0,.25)}
.mode-card strong{display:block;font:22px var(--display);color:var(--gold-hot);margin-bottom:7px}
.mode-card small{color:var(--muted);font-size:11px}
.home-tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.home-tool{padding:9px 13px;background:transparent;color:var(--muted);font-size:11px}
.home-tool:hover{background:rgba(102,199,196,.08)}
.home-footer{display:flex;justify-content:space-between;gap:15px;margin-top:35px;color:var(--faint);font-size:10px;letter-spacing:.05em}

/* 工作台 */
#app-shell{min-height:100vh}
header{
  height:58px;display:flex;align-items:center;gap:16px;padding:0 18px;
  border-bottom:1px solid var(--line-strong);background:rgba(11,20,27,.92);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)
}
.brand{display:flex;align-items:center;gap:10px;min-width:205px}
.brand-icon{width:27px;height:27px;object-fit:contain}
.brand h1{font-size:17px;color:#f4f0e3}
.brand small{display:block;color:var(--muted);font:10px var(--sans);letter-spacing:.08em}
.tabs{display:flex;gap:4px;height:100%;align-items:center}
.tab{border:0;border-radius:0;background:transparent;color:var(--muted);height:100%;padding:0 14px;position:relative}
.tab:after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:transparent}
.tab.on{color:var(--gold-hot);background:rgba(209,178,106,.06)}
.tab.on:after{background:var(--gold)}
.header-tools{margin-left:auto;display:flex;gap:5px}
.header-tool{background:transparent;border-color:transparent;color:var(--muted);padding:6px 9px;font-size:11px}
.header-tool:hover{border-color:var(--line);color:var(--ink)}

main{display:grid;grid-template-columns:245px minmax(420px,1fr) 335px;gap:0;min-height:calc(100vh - 58px)}
aside,section{min-width:0;overflow:auto;padding:16px}
aside{background:rgba(13,24,31,.70);border-right:1px solid var(--line)}
#right{background:rgba(13,24,31,.80);border-left:1px solid var(--line)}
#palette{display:flex;flex-direction:column;gap:12px;min-height:0}
.palette-items{overflow:auto;min-height:0;flex:1}
.pgroup{margin-bottom:18px}.pgroup h4{margin-bottom:8px}
.prow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.pb{display:flex;align-items:center;gap:6px;min-width:0;padding:6px;line-height:1.15;text-align:left;background:rgba(20,39,48,.70)}
.pb-icon{width:28px;height:28px;object-fit:contain;flex:none}
.pb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb i{display:block;font-style:normal;color:var(--muted);font-size:9px;overflow:hidden;text-overflow:ellipsis}
.pb.on{color:#071619;background:var(--teal);border-color:var(--teal)}.pb.on i{color:#174346}
.brush-info{flex:none;max-height:38%;overflow:auto;padding:12px;background:rgba(22,45,51,.68);
  border:1px solid rgba(102,199,196,.34);border-left:2px solid var(--teal);font-size:11px;color:#c4d6d6}
.brush-info b{display:block;color:#eff6ed;font:16px var(--display);margin-bottom:7px}
.brush-info div{padding:5px 0;border-top:1px solid rgba(177,210,209,.14)}

#modebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:11px 13px;
  background:rgba(18,38,47,.76);border:1px solid var(--line);border-top:2px solid var(--gold);
  margin-bottom:12px;box-shadow:0 9px 25px rgba(0,0,0,.12)}
#modebar label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
#modebar label select{max-width:150px}.civ-ability{flex:1 0 100%;color:var(--muted);font-size:11px;padding-top:4px}
.civ-ability b{color:var(--gold-hot)}.tool-group{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}
.tool-button.on{background:rgba(216,120,104,.20);border-color:var(--red);color:#ffd8d1}
.lvhead{display:flex;flex-wrap:wrap;align-items:center;gap:7px;width:100%;padding-bottom:4px}
.chip{background:rgba(9,18,24,.74);border:1px solid var(--line);border-radius:2px;padding:2px 7px;font-size:10px;color:var(--muted)}
.goal{display:flex;align-items:center;gap:8px;width:100%;margin-top:6px}.gname{width:38px;font-size:11px;font-weight:600}
.gbar{flex:1;height:6px;background:rgba(0,0,0,.28);border-radius:1px;overflow:hidden}.gbar i{display:block;height:100%;transition:width .18s}
.gnum{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted)}.gnum.ok{color:var(--green);font-weight:600}
.lvfoot{display:flex;flex-wrap:wrap;align-items:center;gap:7px;width:100%;margin-top:8px}

#play{min-height:100%}#tileinfo{font-size:11px;color:var(--muted);margin:0 0 10px;min-height:16px}
#map{padding:10px 4px 14px;background:rgba(5,13,18,.28);border:1px solid rgba(169,190,188,.12);min-height:330px}
#map.multi svg{min-width:1050px}svg{width:100%;height:auto;display:block}
g.hex polygon{stroke:#081117;stroke-width:1.4}g.hex{cursor:pointer}
g.hex:hover polygon:first-child{stroke:var(--teal);stroke-width:2.7}g.hex.sel polygon:first-child{stroke:#fff1bc;stroke-width:2.5}
g.hex.blocked{cursor:not-allowed}g.hex.neutral polygon:first-child{filter:saturate(.45) brightness(.68);stroke:#789097;stroke-dasharray:3 2}
.territory-A polygon:first-child{stroke:#b79a58;stroke-width:1.8}
.territory-B polygon:first-child{stroke:#649ca0;stroke-width:1.8}
.territory-C polygon:first-child{stroke:#9b718e;stroke-width:1.8}
.territory-D polygon:first-child{stroke:#7fa56f;stroke-width:1.8}
.territory-A polygon:first-child{stroke:#b79a58;stroke-width:1.8}
.territory-B polygon:first-child{stroke:#649ca0;stroke-width:1.8}
.territory-C polygon:first-child{stroke:#9b718e;stroke-width:1.8}
.territory-D polygon:first-child{stroke:#7fa56f;stroke-width:1.8}
.veil{fill:rgba(5,10,13,.57);stroke:none;pointer-events:none}.dist{fill:rgba(9,18,24,.82);stroke:#d5e1de;stroke-width:1.3}
.dist.center{stroke:var(--gold);stroke-width:2.1}.dist.center.chosen{stroke:var(--teal);stroke-width:3.1}
text{text-anchor:middle;pointer-events:none;font-family:var(--sans)}.dname{font-size:12px;font-weight:700;fill:#eaf3fb}
.dname2{font-size:9px;fill:#b7c8c9}.bcount{font-size:9px;fill:var(--gold-hot)}.feat{font-size:15px;fill:rgba(255,255,255,.72)}
.res{fill:var(--gold);stroke:#302714;stroke-width:1}.resource-icon{paint-order:stroke;stroke:#081117;stroke-width:2}
.river-edge{fill:none;stroke:#74d7ee;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 2px rgba(31,120,163,.8));pointer-events:none}
.lake-surface{fill:#397ca3;stroke:#7ecde3;stroke-width:1.2;opacity:.94;pointer-events:none}
.wonder{font-size:13px;fill:var(--gold-hot)}.pv{font-size:14px;font-weight:800;paint-order:stroke;stroke:#081117;stroke-width:3.5}

#diag{margin-top:8px}.tot{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid rgba(177,200,199,.10);
  cursor:pointer;font-variant-numeric:tabular-nums}.tot:hover,.tot.hi{background:rgba(102,199,196,.08)}
.tot .yname{flex:1}.dot{width:8px;height:8px;border-radius:99px;display:inline-block;flex:none}
.citysum{display:flex;flex-direction:column;gap:2px;cursor:pointer;border:1px solid var(--line);border-radius:2px;padding:8px 9px;margin:5px 0;font-size:11px;background:rgba(17,34,42,.45)}
.citysum.active{border-color:var(--teal);background:rgba(102,199,196,.08)}.citysum span{color:var(--muted)}
.bd-tile{margin:9px 0;padding:10px 11px;background:rgba(21,42,49,.72);border:1px solid rgba(177,200,199,.16);
  border-left:2px solid var(--gold);border-radius:2px}.bd-tile-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-bottom:7px}
.bd-tile-head>b{font:15px var(--display);color:#edf5eb}.bd-sums{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px}
.bd-sum{font-size:10px;border:1px solid var(--yield);color:var(--yield);border-radius:2px;padding:1px 4px;font-variant-numeric:tabular-nums}
.bd-entry{border-top:1px solid rgba(177,200,199,.13);padding:7px 0 3px;font-size:11px}.bd-entry-top{display:flex;justify-content:space-between;gap:8px;color:#d9e5ed}
.bd-entry-top b{white-space:nowrap}.bd-explain{color:#aebfcb;margin-top:3px}.bd-rule{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#718da0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvlist{width:100%;border-collapse:collapse;font-size:12px;background:rgba(12,24,31,.45)}.lvlist th{text-align:left;color:var(--muted);font-weight:600;font-size:10px;padding:8px;border-bottom:1px solid var(--line)}
.lvlist td{padding:9px 8px;border-bottom:1px solid rgba(177,200,199,.12)}.lvlist tbody tr{cursor:pointer}.lvlist tbody tr:hover{background:rgba(102,199,196,.08)}
.settle{margin-top:10px;padding:13px;border-radius:2px;width:100%;background:rgba(21,42,49,.72);border:1px solid var(--line)}
.settle.win{border-color:rgba(138,201,154,.65)}.settle.lose{border-color:rgba(216,120,104,.65)}.stitle{font:18px var(--display)}
.stars{font-size:22px;color:var(--gold-hot);letter-spacing:3px;margin:2px 0 6px}.sgrid{border-collapse:collapse;font-size:11px}
.sgrid td{padding:3px 10px 3px 0;vertical-align:top}.sgrid td:first-child{color:var(--muted);white-space:nowrap}

/* 设置弹窗 */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(3,8,11,.74);backdrop-filter:blur(8px)}
.modal[hidden],#home-screen[hidden],#app-shell[hidden]{display:none}.modal-card{width:min(720px,100%);padding:22px;background:#10212a;border:1px solid var(--line-strong);box-shadow:0 24px 80px rgba(0,0,0,.45)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.modal-head h2{font-size:25px;color:var(--gold-hot)}
.modal-close{font-size:22px;border:0;background:transparent;color:var(--muted)}.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.settings-card{padding:14px;background:rgba(7,16,22,.55);border:1px solid var(--line);min-height:150px}
.settings-kicker{display:block;color:var(--teal);font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
.settings-card h3{font-size:18px;margin-bottom:7px;color:#edf2e8}.settings-card p,.settings-card a{display:block;color:var(--muted);font-size:11px;margin:5px 0}
.settings-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}.switch-row{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;color:var(--ink);font-size:12px;margin-top:15px}
.switch-row input{accent-color:var(--teal)}.switch-row small{grid-column:2;color:var(--muted);font-size:10px}

.progression-modal{place-items:stretch;padding:0;background:rgba(3,8,11,.92)}.progression-modal .modal-card{width:100%;height:100%;min-width:0;max-width:none;display:flex;flex-direction:column;padding:22px 26px 24px;border:0}
.progression-modal .modal-head{margin-bottom:10px;flex:0 0 auto}.progression-modal .modal-head h2{font-size:27px}
.progression-tabs{display:none}
.progression-tab{border:0;border-radius:0;background:transparent;color:var(--muted);padding:8px 16px;position:relative}
.progression-tab.on{color:var(--gold-hot);background:rgba(209,178,106,.08)}.progression-tab.on:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--gold)}
.progression-summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-bottom:12px}
.progression-summary b{color:var(--gold-hot);font:16px var(--display)}.focus-legend{color:var(--gold)}
.progression-modal #progression-content{display:flex;flex:1;width:100%;min-width:0;min-height:0;flex-direction:column}
.progression-hover{display:grid;grid-template-columns:minmax(150px,.75fr) minmax(280px,2fr);gap:8px 20px;min-height:84px;margin:0 0 12px;padding:13px 16px;background:rgba(5,13,18,.74);border:1px solid var(--line);border-left:3px solid var(--gold)}
.progression-hover b{color:var(--gold-hot);font:19px var(--display)}.progression-hover p{margin:0;color:#d4dddd;font-size:12px;line-height:1.55}.progression-hover small{grid-column:1/-1;color:var(--muted);font-size:10px}
.tree-board{overflow-x:auto;overflow-y:hidden;flex:1;width:100%;min-width:0;min-height:0;padding:0 0 10px;background:#071219;border:1px solid var(--line);overscroll-behavior:contain;scrollbar-color:rgba(209,178,106,.65) rgba(5,13,18,.8);cursor:grab;touch-action:pan-x;user-select:none}
.tree-board.dragging{cursor:grabbing}
.tree-canvas{position:relative;background:
  radial-gradient(circle at 18px 18px,rgba(159,186,192,.12) 0 1px,transparent 1.5px) 0 0/36px 36px,
  linear-gradient(90deg,rgba(209,178,106,.045) 1px,transparent 1px) 52px 0/288px 100%,
  linear-gradient(180deg,rgba(102,199,196,.06),transparent 18%,transparent 82%,rgba(209,178,106,.04))}
.tree-canvas>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tree-branch{fill:none;stroke:rgba(129,165,174,.42);stroke-width:2.2;filter:drop-shadow(0 0 2px rgba(5,13,18,.8))}.tree-branch.focus{stroke:rgba(209,178,106,.78);stroke-width:2.8}.tree-branch.unlocked{stroke:rgba(102,199,196,.82);stroke-width:3}
.tree-layer{position:absolute;top:15px;color:rgba(209,178,106,.62);font:10px var(--sans);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.tree-node-wrap{position:absolute}
.progression-node{display:block;width:100%;height:34px;text-align:left;margin:0;padding:4px 8px;background:linear-gradient(145deg,rgba(22,45,55,.98),rgba(10,24,31,.98));border:1px solid rgba(167,190,195,.30);border-left:3px solid transparent;box-shadow:0 5px 12px rgba(0,0,0,.27);position:relative;overflow:hidden}
.progression-node:after{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.045);pointer-events:none}
.progression-node:hover{transform:translateY(-1px);background:linear-gradient(145deg,rgba(37,71,78,.98),rgba(12,31,37,.98));border-color:var(--teal);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.progression-node.focus{border-left-color:var(--gold);box-shadow:0 5px 14px rgba(140,105,35,.18)}.progression-node.unlocked{background:linear-gradient(145deg,rgba(20,74,75,.98),rgba(10,38,42,.98));border-color:rgba(102,199,196,.72)}
.progression-node .node-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:8px;line-height:1;position:relative;z-index:1}
.progression-node .node-era{font-style:normal;color:var(--teal);letter-spacing:.08em}.progression-node.unlocked .node-era{color:#a8eee1}
.progression-node .node-top b{font-weight:600;color:var(--gold);font-size:8px}.progression-node.unlocked .node-top b{color:#b3eee1}
